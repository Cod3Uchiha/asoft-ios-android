name: IOS-ui Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile IOS-ui APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Prepare Gradle
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          chmod +x gradlew

      - name: Fetch pinned upstream runtime payload
        env:
          UPSTREAM_APK: https://github.com/alpersamur3/asoft-ios-android/releases/download/v0.1.6/ASoftware-iOS-Android-0.1.6.apk
          UPSTREAM_SHA256: befbcc1b31d83f166870010300a2a302e3570a7d3622d8de9c02fd896eeaa0cf
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 --output /tmp/asoft-upstream.apk "$UPSTREAM_APK"
          echo "$UPSTREAM_SHA256  /tmp/asoft-upstream.apk" | sha256sum --check -
          rm -rf /tmp/asoft-runtime
          mkdir -p /tmp/asoft-runtime
          unzip -q /tmp/asoft-upstream.apk 'assets/*' 'lib/arm64-v8a/*' -d /tmp/asoft-runtime
          if [ ! -d /tmp/asoft-runtime/assets ]; then
            echo "::error::The pinned upstream APK contains no assets directory"
            exit 1
          fi
          cp -a /tmp/asoft-runtime/assets/. app/src/main/assets/
          cp -a /tmp/asoft-runtime/lib/arm64-v8a/. app/src/main/jniLibs/arm64-v8a/
          # Gradle generates the fork's tracked setup manifest for clean builds.
          rm -f app/src/main/assets/setup/asoft-setup.json
          echo "Imported upstream runtime payload:"
          du -sh app/src/main/assets app/src/main/jniLibs/arm64-v8a
          find app/src/main/assets -type f | wc -l
          find app/src/main/jniLibs/arm64-v8a -type f | wc -l

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compile IOS-ui debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify complete IOS-ui runtime payload
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" > apk-contents.txt
          required=(
            "assets/setup/asoft-setup.json"
            "assets/xnu/kernel.development.sweet"
            "assets/helper/Image.gz.bin"
            "assets/helper/initrd.gz.bin"
            "assets/helper/Image16k.gz.bin"
            "assets/setup/tools/ipsw-devicetree.py"
            "assets/setup/tools/lzfse.py"
            "assets/setup/tools/mkadt.py"
            "assets/setup/tools/adt.py"
            "assets/setup/tools/mkpayload.py"
            "lib/arm64-v8a/libqemu.so"
            "lib/arm64-v8a/libqemuimg.so"
            "lib/arm64-v8a/libqemu26.so"
            "lib/arm64-v8a/lib_libvulkan_freedreno.so.so"
            "lib/arm64-v8a/lib_libvulkan.so.so"
            "assets/setup/steps/ios26"
            "assets/setup/scripts/ios26"
          )
          missing=0
          for file in "${required[@]}"; do
            if ! grep -Fq "$file" apk-contents.txt; then
              echo "::error::IOS-ui APK is missing required runtime file: $file"
              missing=1
            fi
          done
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.cod3uchiha.iosui'"
          if [ "$missing" -ne 0 ]; then
            echo "::error::This build is compile-only and must not be distributed. Run pull-setup.sh and pull-libs.sh before building."
            exit 1
          fi
          cp "$APK" app/build/outputs/apk/debug/IOS-ui-debug.apk

      - name: Upload IOS-ui APK
        uses: actions/upload-artifact@v4
        with:
          name: IOS-ui-debug
          path: app/build/outputs/apk/debug/IOS-ui-debug.apk
          if-no-files-found: error
          retention-days: 14
