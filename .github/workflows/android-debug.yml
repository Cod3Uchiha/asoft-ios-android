name: IOS-ui Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile IOS-ui APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Prepare Gradle
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compile IOS-ui debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify complete IOS-ui runtime payload
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" > apk-contents.txt
          required=(
            "assets/setup/asoft-setup.json"
            "assets/xnu/kernel.development.sweet"
            "assets/helper/Image.gz.bin"
            "assets/helper/initrd.gz.bin"
            "assets/helper/Image16k.gz.bin"
            "assets/setup/tools/ipsw-devicetree.py"
            "assets/setup/tools/lzfse.py"
            "assets/setup/tools/mkadt.py"
            "assets/setup/tools/adt.py"
            "assets/setup/tools/mkpayload.py"
            "lib/arm64-v8a/libqemu.so"
            "lib/arm64-v8a/libqemuimg.so"
          )
          missing=0
          for file in "${required[@]}"; do
            if ! grep -Fq "$file" apk-contents.txt; then
              echo "::error::IOS-ui APK is missing required runtime file: $file"
              missing=1
            fi
          done
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.cod3uchiha.iosui'"
          if [ "$missing" -ne 0 ]; then
            echo "::error::This build is compile-only and must not be distributed. Run pull-setup.sh and pull-libs.sh before building."
            exit 1
          fi
          cp "$APK" app/build/outputs/apk/debug/IOS-ui-debug.apk

      - name: Upload IOS-ui APK
        uses: actions/upload-artifact@v4
        with:
          name: IOS-ui-debug
          path: app/build/outputs/apk/debug/IOS-ui-debug.apk
          if-no-files-found: error
          retention-days: 14
